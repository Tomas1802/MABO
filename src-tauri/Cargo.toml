[package]
name = "mabo"
version = "2.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
portable-pty = "0.9"
arboard = "3"
png = "0.17"
serde = { version = "1", features = ["derive"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1.0.154"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
